name: Runner Maintenance

on:
  schedule:
    # Every Monday at 16:00 UTC
    - cron: '0 16 * * 1'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: bithollow
    steps:
      - name: Update Symlinks and Cleanup
        run: |
          # 1. Navigate to the runner installation root
          # From _work/repo/repo up to root
          cd ../../
          
          echo "Operating in: $(pwd)"

          # 2. Identify the latest versioned directories
          LATEST_BIN=$(ls -vd bin.[0-9]* 2>/dev/null | tail -n 1)
          LATEST_EXT=$(ls -vd externals.[0-9]* 2>/dev/null | tail -n 1)
          
          CURRENT_BIN=$(readlink bin)
          CURRENT_EXT=$(readlink externals)

          RESTART_REQUIRED=false

          # 3. Force symlink update if outdated
          if [ -n "$LATEST_BIN" ] && [ "$LATEST_BIN" != "$CURRENT_BIN" ]; then
              echo "Fixing bin link: $CURRENT_BIN -> $LATEST_BIN"
              ln -sfn "$LATEST_BIN" bin
              RESTART_REQUIRED=true
          fi

          if [ -n "$LATEST_EXT" ] && [ "$LATEST_EXT" != "$CURRENT_EXT" ]; then
              echo "Fixing externals link: $CURRENT_EXT -> $LATEST_EXT"
              ln -sfn "$LATEST_EXT" externals
              RESTART_REQUIRED=true
          fi

          # 4. Cleanup old versions and update artifacts
          echo "Purging old versions..."
          ls -vd bin.[0-9]* 2>/dev/null | grep -v "$LATEST_BIN" | xargs rm -rf
          ls -vd externals.[0-9]* 2>/dev/null | grep -v "$LATEST_EXT" | xargs rm -rf
          
          [ -d "_work/_update" ] && echo "Removing _work/_update" && rm -rf _work/_update

          # 5. Handle Restart using setsid (Dash compatible)
          if [ "$RESTART_REQUIRED" = "true" ]; then
              echo "Restarting runner service in a new session..."
              # setsid runs the command in a new session, detaching it from the current shell
              setsid sh -c 'sleep 5; ./svc.sh stop; sleep 2; ./svc.sh start' > maintenance_restart.log 2>&1 &
              echo "Restart sequence backgrounded. Job finishing."
          else
              echo "No version changes detected."
          fi
