name: Runner Maintenance

on:
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: bithollow
    steps:
      - name: 1. Identify and Update Symlinks
        id: check_version
        run: |
          ls -l
          cd ../../
          ls -l
          LATEST_BIN=$(ls -vd bin.[0-9]* 2>/dev/null | tail -n 1)
          LATEST_EXT=$(ls -vd externals.[0-9]* 2>/dev/null | tail -n 1)
          echo 0
          CURRENT_BIN=$(readlink bin)
          CURRENT_EXT=$(readlink externals)
          echo 1

          UPDATED="false"

          if [ -n "$LATEST_BIN" ] && [ "$LATEST_BIN" != "$CURRENT_BIN" ]; then
              echo "Updating bin link to $LATEST_BIN"
              ln -sfn "$LATEST_BIN" bin
              UPDATED="true"
          fi
          echo 2

          if [ -n "$LATEST_EXT" ] && [ "$LATEST_EXT" != "$CURRENT_EXT" ]; then
              echo "Updating externals link to $LATEST_EXT"
              ln -sfn "$LATEST_EXT" externals
              UPDATED="true"
          fi
          echo 3

          # Export variable for subsequent steps
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "latest_bin=$LATEST_BIN" >> $GITHUB_OUTPUT
          echo "latest_ext=$LATEST_EXT" >> $GITHUB_OUTPUT
          echo 4

      - name: 2. Cleanup Old Directories
        run: |
          cd ../../
          LATEST_BIN="${{ steps.check_version.outputs.latest_bin }}"
          LATEST_EXT="${{ steps.check_version.outputs.latest_ext }}"

          echo "Purging versions other than $LATEST_BIN and $LATEST_EXT"
          
          ls -vd bin.[0-9]* 2>/dev/null | grep -v "$LATEST_BIN" | xargs rm -rf
          ls -vd externals.[0-9]* 2>/dev/null | grep -v "$LATEST_EXT" | xargs rm -rf
          
          if [ -d "_work/_update" ]; then
              echo "Removing _work/_update"
              rm -rf _work/_update
          fi

      - name: 3. Detached Service Restart
        if: steps.check_version.outputs.updated == 'true'
        run: |
          cd ../../
          echo "Initiating detached restart for the new version..."
          
          # Use nohup with full redirection to detach from dash/sh
          # The inner shell ensures the sequence continues after the runner stops
          nohup sh -c 'sleep 5; ./svc.sh stop; sleep 2; ./svc.sh start' > maintenance.log 2>&1 &
          
          echo "Restart command backgrounded. Disconnecting now."
